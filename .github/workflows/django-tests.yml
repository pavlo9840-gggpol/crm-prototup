name: Django checks

on:
  push:
    branches:
      - main
      - feature/unified-autozapaz-workflows
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt openpyxl
      - name: Check Django configuration
        run: python manage.py check
      - name: Collect static assets for local deployment
        run: python manage.py collectstatic --noinput
      - name: Check publisher license CLI
        run: python scripts/issue_license.py --help > /dev/null
      - name: Validate release tooling syntax and CLI
        run: |
          python -m py_compile scripts/generate_release_key.py scripts/sign_release.py scripts/verify_release.py
          python scripts/generate_release_key.py --help > /dev/null
          python scripts/sign_release.py --help > /dev/null
          python scripts/verify_release.py --help > /dev/null
      - name: Check migration model state
        run: python manage.py makemigrations --check --dry-run
      - name: Validate Linux installer shell syntax
        run: bash -n deploy/linux/install.sh
      - name: Validate Linux updater shell syntax
        run: bash -n deploy/linux/update.sh
      - name: Validate Linux installer production configuration guards
        run: |
          grep -F 'DJANGO_DEBUG:-' deploy/linux/install.sh
          grep -F 'AUTOZAPAZ_DATA_DIR:-' deploy/linux/install.sh
          grep -F 'AUTOZAPAZ_BACKUP_DIR:-' deploy/linux/install.sh
          grep -F 'AUTOZAPAZ_REQUIRE_LICENSE:-' deploy/linux/install.sh
          grep -F 'AUTOZAPAZ_LICENSE_PUBLIC_KEY:-' deploy/linux/install.sh
          grep -F 'AUTOZAPAZ_RELEASE_PUBLIC_KEY:-' deploy/linux/install.sh
          grep -F '/usr/local/lib/autozapaz/verify_release.py' deploy/linux/install.sh
      - name: Validate Linux service uses Waitress on loopback
        run: |
          grep -F 'ExecStart=/opt/autozapaz/venv/bin/waitress-serve --listen=127.0.0.1:8000 --threads=8 config.wsgi:application' deploy/linux/autozapaz.service
          grep -F 'ReadWritePaths=/var/lib/autozapaz' deploy/linux/autozapaz.service
          ! grep -F 'manage.py serve' deploy/linux/autozapaz.service
      - name: Run workflow regression tests
        run: python manage.py test core --verbosity 2
