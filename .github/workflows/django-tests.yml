name: Django checks

on:
  push:
    branches:
      - main
      - feature/unified-autozapaz-workflows
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt openpyxl
      - name: Check Django configuration
        run: python manage.py check
      - name: Check publisher license CLI
        run: python scripts/issue_license.py --help > /dev/null
      - name: Check migration model state
        run: python manage.py makemigrations --check --dry-run
      - name: Run workflow regression tests
        run: python manage.py test core.tests_dashboard core.tests_receive core.tests_transit core.tests_catalog core.tests_financial_integrity core.tests_access_control core.tests_shipments core.tests_suppliers core.tests_service_workshop core.tests_product_conditions core.tests_fitment_crossrefs core.tests_tenant_context core.tests_product_form core.tests_payroll core.tests_pricing core.tests_admin_tools_tenant core.tests_tenant_foundation core.tests_licensing core.tests_license_entitlements core.tests_installation_setup core.tests_local_store_migration core.tests_legacy_store_merge core.tests_staff_membership_migration core.tests_backup_restore core.tests_upgrade_compatibility core.tests_local_data core.tests_local_server --verbosity 2
