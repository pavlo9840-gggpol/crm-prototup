name: Django checks

on:
  push:
    branches:
      - main
      - feature/unified-autozapaz-workflows
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt openpyxl
      - name: Check Django configuration
        run: python manage.py check
      - name: Run workflow regression tests
        run: python manage.py test core.tests_dashboard core.tests_receive core.tests_transit core.tests_catalog core.tests_financial_integrity --verbosity 2
